scalar DateTime
scalar JSON

type File {
  id: ID!
  path: String!
  state: String!
  access: String!
  content_type: String!
  size: Int
  digest: String
  metadata: JSON!
  version_count: Int!
  created_at: DateTime!
  updated_at: DateTime!
  versions(limit: Int = 100, cursor: String): FileVersionPage!
}

enum FileSort {
  CREATED_AT_ASC
  CREATED_AT_DESC
}

type FilePage {
  items: [File!]!
  nextCursor: String
}

type FileVersion {
  id: ID!
  number: Int!
  content_type: String!
  size: Int!
  digest: String!
  metadata_snapshot: JSON!
  created_by: String
  created_at: DateTime!
}

type FileVersionPage {
  items: [FileVersion!]!
  nextCursor: String
}

type Webhook {
  id: ID!
  target_url: String!
  events: String!
  active: Boolean!
  created_at: DateTime!
  deliveries(limit: Int = 100, cursor: String, state: String): WebhookDeliveryPage!
}

enum WebhookSort {
  CREATED_AT_ASC
  CREATED_AT_DESC
}

type WebhookPage {
  items: [Webhook!]!
  nextCursor: String
}

type WebhookDelivery {
  id: ID!
  state: String!
  attempts: Int!
  last_status: Int
  next_attempt_at: DateTime
  created_at: DateTime!
}

type WebhookDeliveryPage {
  items: [WebhookDelivery!]!
  nextCursor: String
}

type Event {
  id: ID!
  action: String!
  payload: JSON!
  created_at: DateTime!
}

enum EventSort {
  CREATED_AT_ASC
  CREATED_AT_DESC
}

type EventPage {
  items: [Event!]!
  nextCursor: String
}

type Run {
  id: ID!
  workflow: String!
  status: String!
  output: JSON
  error: String
  created_at: DateTime!
  ended_at: DateTime
}

enum RunSort {
  CREATED_AT_ASC
  CREATED_AT_DESC
}

type RunPage {
  items: [Run!]!
  nextCursor: String
}

type Query {
  files(limit: Int = 100, cursor: String, state: String, sort: FileSort): FilePage!
  file(id: ID!): File
  webhooks(limit: Int = 100, cursor: String, sort: WebhookSort): WebhookPage!
  webhook(id: ID!): Webhook
  events(limit: Int = 100, cursor: String, action: String, sort: EventSort): EventPage!
  event(id: ID!): Event
  runs(limit: Int = 100, cursor: String, status: String, sort: RunSort): RunPage!
  run(id: ID!): Run
  search(q: String!, mode: String, limit: Int, prefix: String, contentType: String, cursor: String, facets: String): JSON!
  fileText(id: String!): JSON!
}

type Mutation {
  fileCreate(path: String!, contentType: String, access: String, metadata: JSON, idempotencyKey: String): File!
  fileIssueUrl(id: ID!, ttlSecs: Int, maxUses: Int): JSON!
  fileIssueUploadUrl(id: ID!, ttlSecs: Int): JSON!
  fileIssueEdgeUrl(id: ID!, ttlSecs: Int): JSON!
  fileRequestRendition(id: ID!, kind: String, width: Int, height: Int, format: String): JSON!
  fileTransform(id: ID!, transformer: String!, params: JSON, contentType: String): JSON!
  fileFetch(url: String!, path: String!, contentType: String, access: String, metadata: JSON, idempotencyKey: String, markers: JSON): JSON!
  fileRemove(id: ID!): Boolean!
  webhookRegister(url: String!, events: JSON): JSON!
  webhookRemove(id: ID!): Boolean!
  runStart(workflow: String!, input: JSON, file: String, idempotencyKey: String, mode: String): JSON!
  runRetry(id: ID!): JSON!
}

type Subscription {
  eventChanged(action: String): Event!
}
