name: CI

on:
  pull_request:
    branches:
      - main
  # A merge re-verifies a tree the pull request already proved, and on
  # a single runner that duplicate build is what every later pull
  # request queues behind: one evening of back-to-back merges turned a
  # thirty-minute pipeline into a two-hour wait. Main is checked on a
  # schedule instead. That keeps the signal for drift arriving without
  # a commit, which is how a new advisory once reddened this branch,
  # and it keeps a default-branch cache warm for pull requests to
  # restore, which a bare pull-request trigger would have lost.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Per-ref concurrency: a new push cancels the in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, shaman]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Both jobs name one cache, so whichever runs second finds the
      # registry already downloaded. This job owns writing it.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-copal"
          shared-key: "workspace"

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # shaman's runner pod has a 6Gi memory limit and no CPU limit, so
      # cargo would otherwise start one rustc or linker per host core.
      # Linking the integration-test binaries that wide, each carrying
      # the embedded SurrealDB engine, outgrew the limit: from
      # 2026-09-26 every run lost its runner about fifteen minutes into
      # this step. Clippy links nothing and keeps the full width.
      - name: cargo test
        run: cargo test --workspace
        env:
          CARGO_BUILD_JOBS: 2

      - name: Dependency audit
        run: |
          if ! command -v cargo-audit >/dev/null 2>&1; then
            curl -fsSL "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv0.22.2/cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz"               | tar -xz --strip-components=1 -C "$HOME/.cargo/bin"
          fi
          cargo audit

  # No `needs` between the jobs: they are independent, so a second
  # runner parallelizes them the moment one exists. With one runner
  # they queue, and the shared cache is what keeps the second cheap.
  sdks:
    name: assemble + validate SDKs
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, shaman]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Restores what the check job wrote and writes nothing back: two
      # jobs saving one key is a race whose loser uploaded for nothing.
      # The assembled crate carries no private dependency, so the
      # registry is all this job wants from the cache.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-copal"
          shared-key: "workspace"
          save-if: "false"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Assemble and validate the four SDKs
        run: bash sdks/build.sh

  # The console is generated markup, and the Rust tests already assert
  # it renders, its links resolve, every example the reference offers
  # runs, and the schema it prints parses. What they cannot see is
  # layout, and answering that takes an engine that lays out boxes.
  #
  # On a GitHub-hosted runner rather than aur0: Playwright's browsers
  # need a newer base than the runner container's Ubuntu 20.04, and
  # driving them from a sibling container through the mounted docker
  # socket puts the browser in the host's network namespace, where it
  # cannot reach a server started inside the runner. The Rust cache the
  # check job writes restores here, so the build is incremental despite
  # the different machine.
  console:
    name: Console layout
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Restores what the check job wrote and writes nothing back: two
      # jobs saving one key is a race whose loser uploaded for nothing.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-copal"
          shared-key: "workspace"
          save-if: "false"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install the checks
        run: npm --prefix console ci

      # Cached across runs by version, because the download is larger
      # than everything else this job installs put together.
      - name: Cache the browser
        id: browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('console/package-lock.json') }}

      - name: Install the browser
        if: steps.browser.outputs.cache-hit != 'true'
        run: npx --prefix console playwright install --with-deps chromium

      # The system libraries are outside the cache, so they are asked
      # for either way.
      - name: Install the browser's dependencies
        if: steps.browser.outputs.cache-hit == 'true'
        run: npx --prefix console playwright install-deps chromium

      - name: Ask the browser what the console looks like
        run: ./console/run.sh
