[workspace]
resolver = "2"
members = [
    "crates/copal-core",
    "crates/copal-store",
    "crates/copal-blob",
    "crates/copal-sign",
    "crates/copal-flow",
    "crates/copal-server",
    "crates/copal-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "AGPL-3.0-only"
repository = "https://github.com/Oneiriq/copal"
authors = ["Shon Thomas <shonpt@outlook.com>"]

[workspace.dependencies]
copal-core = { path = "crates/copal-core" }
copal-store = { path = "crates/copal-store" }
copal-blob = { path = "crates/copal-blob" }
copal-sign = { path = "crates/copal-sign" }
copal-flow = { path = "crates/copal-flow" }

# Schema, query building, and the SurrealDB client all come from
# surql-rs, taken from the registry. 0.32 is the batched release the
# adoption work was written against.
oneiriq-surql = { version = "0.33", default-features = false, features = ["client-rustls"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "3"
sha2 = "0.11"
hex = "0.4"
opendal = { version = "0.58", default-features = false, features = ["services-fs", "services-s3", "services-gcs", "services-azblob"] }
axum = "0.8"
tempfile = "3"
futures = "0.3"
bytes = "1"
rand = "0.10"

# Full debug info costs more than it returns here. The workspace links
# surrealdb into every one of its test binaries, and on Windows each
# gets its own PDB. Cargo never collects the stale ones, so a week of
# builds left 856 of them holding 457 GB, most of a 790 GB target
# directory on a disk at 99%.
#
# Measured after this change, over one full build of every test
# binary: 145 MB per PDB against 535 MB before, and 26.7 GB of target
# in total. That slows the accumulation rather than ending it, so a
# periodic `cargo clean` is still the remedy.
#
# Line tables keep what failures are actually read with: a panic
# backtrace naming a file, a line, and the symbols around it, verified
# after the change. What they give up is stepping through this code in
# a native debugger, and anyone who needs that can raise it for a run.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
