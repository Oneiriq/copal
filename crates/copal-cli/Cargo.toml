[package]
name = "copal-cli"
version = "0.1.0"
edition = "2021"
description = "copalctl: the Copal service from a terminal."
license = "Apache-2.0"

[[bin]]
name = "copalctl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "json",
    "query",
    "stream",
] }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
copal-server = { path = "../copal-server" }
copal-store = { path = "../copal-store" }
copal-blob = { path = "../copal-blob" }
tempfile = "3"
axum = "0.8"
