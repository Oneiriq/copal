name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

# Per-ref concurrency: a new push cancels the in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, aur0]
    steps:
      - uses: actions/checkout@v6

      # oneiriq-janus is a private git dependency declared over ssh;
      # in CI the org read token rewrites it to https. The committed
      # .cargo/config.toml already routes cargo through the git CLI,
      # which honors insteadOf.
      - name: Authorize private git dependencies
        run: |
          git config --global url."https://x-access-token:${ONEIRIQ_READ_PAT}@github.com/Oneiriq/".insteadOf "ssh://git@github.com/Oneiriq/"
        env:
          ONEIRIQ_READ_PAT: ${{ secrets.ONEIRIQ_READ_PAT }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-copal-stable"

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Dependency audit
        run: |
          if ! command -v cargo-audit >/dev/null 2>&1; then
            curl -fsSL "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv0.22.2/cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz"               | tar -xz --strip-components=1 -C "$HOME/.cargo/bin"
          fi
          cargo audit

  sdks:
    name: assemble + validate SDKs
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, aur0]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-copal-sdk"
          workspaces: "sdks/dist/rust"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assemble and validate the four SDKs
        run: bash sdks/build.sh
