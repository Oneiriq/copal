services:
  surrealdb:
    image: surrealdb/surrealdb:v3.0.5
    command: start --user root --pass root rocksdb:/data/copal.db
    environment:
      # Buckets stay experimental in v3; enabling them costs nothing and
      # keeps the surreal-bucket blob backend testable.
      SURREAL_CAPS_ALLOW_EXPERIMENTAL: files
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - surreal-data:/data

volumes:
  surreal-data:
