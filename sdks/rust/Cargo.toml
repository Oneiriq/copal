# Skeleton for the published Rust SDK. `sdks/build.sh` assembles the
# real package into `sdks/dist/rust`: this manifest, the version from
# `sdks/VERSION`, and the generated client as `src/lib.rs`.
[package]
name = "oneiriq-copal"
version = "0.0.0"
edition = "2021"
description = "Client for the Copal file service, generated by janus from the contract."
license = "AGPL-3.0-only"
repository = "https://github.com/Oneiriq/copal"

[lib]
name = "copal"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Detached on purpose: the assembled package builds outside the copal
# workspace.
[workspace]
