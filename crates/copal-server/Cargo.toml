[package]
name = "copal-server"
description = "Copal HTTP API: the axum serving layer over the store and blob planes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# The embedded tier ships by default: one binary that can run with no
# external SurrealDB process (`COPAL_DB_URL=surrealkv://...`). Opt out
# with --no-default-features for a client-only build.
default = ["embedded"]
embedded = ["copal-store/embedded"]

[dependencies]
copal-core = { workspace = true }
copal-store = { workspace = true }
copal-blob = { workspace = true }
copal-sign = { workspace = true }
copal-flow = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = { workspace = true }
ulid = { workspace = true }
hex = { workspace = true }
bytes = { workspace = true }
# The contract layer, from its own repo. The files contract is defined
# over copal-store's real schema; the drift gate compares generated
# artifacts against the checked-in documents, and the RUNTIME serves
# /graphql from the very same contract object; resolvers dispatch into
# this crate's repositories through Janus middleware.
oneiriq-janus = { git = "ssh://git@github.com/Oneiriq/janus.git", branch = "main", features = [
    "graphql",
    "console",
] }
maud = "0.27"
serde_urlencoded = "0.7"

async-graphql = { version = "7", features = ["dynamic-schema"] }
tower-http = { version = "0.6", features = ["timeout", "cors"] }
base64 = "0.22"
# SigV4 verification for the S3 gateway.
hmac = "0.12"
sha2 = { workspace = true }
# Webhook delivery.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
] }
# Rendition decoding and encoding. Decoders cover the common upload
# formats; renditions encode to jpeg or png.
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
] }
httpdate = "1"
humantime = "2"
tracing-opentelemetry = "0.33.0"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "http-proto", "reqwest-rustls"] }
opentelemetry = "0.32"

[dev-dependencies]
base64 = "0.22"
tempfile = { workspace = true }
ulid = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
surrealdb = { version = "3", default-features = false, features = ["kv-mem"] }
