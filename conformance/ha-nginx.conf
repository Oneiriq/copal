worker_processes 1;
events { worker_connections 256; }
http {
    # Round robin across both instances on every surface, so every
    # consecutive request may land on a different process. That is
    # the hostile-but-honest shape for proving leases, claims, and
    # multipart survive instance hops.
    upstream api { server copal:8080; server copal2:8080; }
    upstream s3 { server copal:9000; server copal2:9000; }
    upstream admin { server copal:8081; server copal2:8081; }

    server {
        listen 8080;
        location / { proxy_pass http://api; proxy_http_version 1.1; }
    }
    server {
        listen 9000;
        client_max_body_size 0;
        location / {
            proxy_pass http://s3;
            proxy_http_version 1.1;
            proxy_request_buffering off;
        }
    }
    server {
        listen 8081;
        location / { proxy_pass http://admin; proxy_http_version 1.1; }
    }
}
