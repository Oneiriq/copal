name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

# Per-ref concurrency: a new push cancels the in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, aur0]
    steps:
      - uses: actions/checkout@v6

      # oneiriq-janus is a private git dependency declared over ssh;
      # in CI the org read token rewrites it to https. The committed
      # .cargo/config.toml already routes cargo through the git CLI,
      # which honors insteadOf.
      - name: Authorize private git dependencies
        run: |
          git config --global url."https://x-access-token:${ONEIRIQ_READ_PAT}@github.com/Oneiriq/".insteadOf "ssh://git@github.com/Oneiriq/"
        env:
          ONEIRIQ_READ_PAT: ${{ secrets.ONEIRIQ_READ_PAT }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-copal-stable"

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Dependency audit
        run: |
          command -v cargo-audit >/dev/null 2>&1 || cargo install --locked cargo-audit
          cargo audit
