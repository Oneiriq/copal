[package]
name = "copal-server"
description = "Copal HTTP API: the axum serving layer over the store and blob planes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
copal-core = { workspace = true }
copal-store = { workspace = true }
copal-blob = { workspace = true }
copal-sign = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = { workspace = true }
ulid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
surrealdb = { version = "3", default-features = false, features = ["kv-mem"] }
