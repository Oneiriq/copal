[package]
name = "copal-core"
description = "Copal domain types: ids, digests, the file state machine. Pure, no IO."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ulid = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# The same English Snowball stemmer the engine's analyzer uses, so
# local scoring agrees with what the index matched. Already in the
# tree by way of surrealdb.
rust-stemmers = "1.2"
