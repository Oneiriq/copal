# Skeleton for the published Python SDK. `sdks/build.sh` assembles
# the real package into `sdks/dist/python`: this manifest, the
# version from `sdks/VERSION`, and the generated client as
# `copal.py`.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oneiriq-copal"
version = "0.0.0"
description = "Client for the Copal file service, generated by kayak from the contract."
readme = { text = "Client for the Copal file service. Generated by kayak; the contract is the source.", content-type = "text/markdown" }
license = "Apache-2.0"
requires-python = ">=3.10"

[tool.hatch.build.targets.wheel]
include = ["copal.py"]

[tool.hatch.build.targets.sdist]
include = ["copal.py", "pyproject.toml"]
